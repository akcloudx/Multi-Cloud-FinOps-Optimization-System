name: Deploy FinOps App to Azure

# Runs on every push to main, or manually via the Actions tab (workflow_dispatch).
# Replaces manually running azure_deploy/deploy_all_resources.ps1's code-deploy
# step by hand after every change.
#
# One-time setup required before this works (see README/CI setup notes):
#   1. In the Azure Portal, open each resource below and download its
#      "Publish Profile" (Overview page -> Get publish profile).
#   2. In this GitHub repo: Settings -> Secrets and variables -> Actions,
#      add:
#        AZURE_WEBAPP_FINOPS_PUBLISH_PROFILE  = contents of the App Service's publish profile
#        AZURE_FUNCTION_FINOPS_PUBLISH_PROFILE = contents of the Function App's publish profile
#   3. Update the app/function names below if they ever change (they're
#      derived from -AppNamePrefix/-OwnerHandle in
#      azure_deploy/deploy_all_resources.ps1 - see that script's header
#      comment for the full naming convention - so they only change if you
#      deploy under a different prefix/handle).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-finops-ascloudx
  AZURE_FUNCTIONAPP_NAME: func-finops-ascloudx

jobs:
  deploy-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors azure_deploy/create_zip.py's file list - keep these two in sync.
      # Running on a Linux runner also means no more Windows-backslash zip-path
      # issues, which is exactly what create_zip.py existed to work around locally.
      - name: Package web app
        run: |
          mkdir -p dist
          cp -r app.py startup.sh ui pricing data db azure_conn aws commitments analysis azure_sdk_vendor .streamlit requirements.txt dist/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_FINOPS_PUBLISH_PROFILE }}
          package: dist

  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # function_app.py's own import chain (data.sync_pipeline -> db.schema/
      # db.crypto, azure_conn.connector, aws.connector, pricing.*) reaches
      # outside the azure_function/ folder into these repo-root packages.
      # `package: azure_function` alone never shipped them, so the Python
      # worker failed to import the function at cold start and Azure indexed
      # ZERO functions from every past deploy - confirmed 2026-08-16 via
      # `az functionapp function list` returning empty and the Portal's
      # Functions blade showing the "create your first function" placeholder,
      # despite this workflow step itself reporting success (Azure/functions-
      # action only verifies the zip upload, not that the app later indexes
      # correctly). Staged into its own dist-func/ so azure_function/'s own
      # host.json/function_app.py/requirements.txt end up at the package
      # root, matching what Azure Functions expects to find there.
      - name: Package function app with its dependencies
        run: |
          mkdir -p dist-func
          cp azure_function/host.json azure_function/function_app.py azure_function/requirements.txt dist-func/
          # "analysis" added 2026-09-01 - real bug caught live via
          # Application Insights ("No module named 'analysis'"): this list
          # was never updated when the VM Rightsizing work added
          # data/sync_pipeline.py's first-ever import from analysis/ - see
          # azure_deploy/deploy_all_resources.ps1's matching comment.
          cp -r db data azure_conn pricing aws analysis dist-func/

      - name: Deploy 24h cron Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: dist-func
          publish-profile: ${{ secrets.AZURE_FUNCTION_FINOPS_PUBLISH_PROFILE }}
          # Azure/functions-action@v1 defaults BOTH of these to false when
          # unset (confirmed from a real run's log, 2026-08-16: "Setting
          # SCM_DO_BUILD_DURING_DEPLOYMENT in Kudu container to false") - the
          # raw zip gets uploaded as-is with no `pip install
          # -r requirements.txt` ever running server-side. Every past deploy
          # "succeeded" while silently shipping a package with none of its
          # third-party dependencies (sqlalchemy, mssql-python,
          # azure-identity, boto3, cryptography, ...) installed - imports
          # failed at cold start and zero functions ever indexed, on top of
          # the separate missing-sibling-folders bug fixed above in the same
          # commit. Both flags are required together for Python remote Oryx
          # build - Microsoft's own official Python Functions Action sample
          # sets both, not just one.
          scm-do-build-during-deployment: true
          enable-oryx-build: true
