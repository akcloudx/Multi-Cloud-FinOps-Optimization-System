<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A202C" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12A150"/>
      <stop offset="100%" stop-color="#0E8A44"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#F7F8FA"/>

  <!-- ===================== User ===================== -->
  <g filter="url(#shadow)">
    <rect x="540" y="18" width="160" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <!-- browser icon + label, centered as one unit -->
  <g transform="translate(583,32)">
    <rect x="0" y="0" width="28" height="22" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="6.5" x2="28" y2="6.5" stroke="#475569" stroke-width="2"/>
    <circle cx="5" cy="3.2" r="1.2" fill="#475569"/>
    <circle cx="9.5" cy="3.2" r="1.2" fill="#475569"/>
  </g>
  <text x="649" y="47" font-size="15" font-weight="700" fill="#1A202C">User</text>
  <text x="620" y="70" font-size="10.5" fill="#94A3B8" text-anchor="middle">Browser</text>

  <line x1="620" y1="84" x2="620" y2="126" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="632" y="110" font-size="11.5" fill="#64748B">HTTPS</text>

  <!-- ===================== Web App + Function App ===================== -->
  <g filter="url(#shadow)">
    <rect x="300" y="128" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#CFE3F7" stroke-width="1.5"/>
    <rect x="300" y="128" width="300" height="6" rx="3" fill="#0078D4"/>
  </g>
  <g transform="translate(322,150)">
    <path d="M12,0 L24,7 L24,17 L12,24 L0,17 L0,7 Z" fill="none" stroke="#0078D4" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="360" y="166" font-size="15.5" font-weight="700" fill="#1A202C">Streamlit Web App</text>
  <text x="360" y="185" font-size="11.5" fill="#64748B">Azure App Service · Linux · F1 (free)</text>
  <text x="360" y="203" font-size="11" fill="#94A3B8">app.py — on-demand sync trigger</text>

  <g filter="url(#shadow)">
    <rect x="660" y="128" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#CFE3F7" stroke-width="1.5"/>
    <rect x="660" y="128" width="300" height="6" rx="3" fill="#0078D4"/>
  </g>
  <g transform="translate(682,148)">
    <path d="M13,0 L2,15 L11,15 L9,28 L22,11 L12,11 Z" fill="#0078D4"/>
  </g>
  <text x="716" y="166" font-size="15.5" font-weight="700" fill="#1A202C">Azure Function App</text>
  <text x="716" y="185" font-size="11.5" fill="#64748B">Consumption plan (Y1)</text>
  <text x="716" y="203" font-size="11" fill="#94A3B8">timerTrigger — every hour, automatic</text>

  <!-- both feed into shared pipeline -->
  <line x1="450" y1="220" x2="450" y2="248" stroke="#64748B" stroke-width="1.75"/>
  <line x1="810" y1="220" x2="810" y2="248" stroke="#64748B" stroke-width="1.75"/>
  <path d="M450,248 L450,262 L620,262 L620,248" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M810,248 L810,262 L620,262 L620,248" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="454" y="242" font-size="10.5" fill="#94A3B8">on-demand</text>
  <text x="736" y="242" font-size="10.5" fill="#94A3B8">hourly</text>

  <!-- ===================== Sync Pipeline (shared orchestrator) ===================== -->
  <g filter="url(#shadow)">
    <rect x="470" y="266" width="300" height="70" rx="14" fill="#1E2761"/>
  </g>
  <text x="620" y="300" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sync Pipeline</text>
  <text x="620" y="320" font-size="11" fill="#B9C2E0" text-anchor="middle">data/sync_pipeline.py</text>

  <!-- pipeline splits to two connectors -->
  <line x1="560" y1="336" x2="450" y2="378" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="680" y1="336" x2="810" y2="378" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- ===================== Azure Connector ===================== -->
  <g filter="url(#shadow)">
    <rect x="300" y="382" width="300" height="80" rx="14" fill="#FFFFFF" stroke="#CFE3F7" stroke-width="1.5"/>
    <rect x="300" y="382" width="6" height="80" rx="3" fill="#0078D4"/>
  </g>
  <text x="330" y="414" font-size="15" font-weight="700" fill="#1A202C">Azure Connector</text>
  <text x="330" y="433" font-size="11" fill="#64748B">azure_conn/connector.py</text>
  <text x="330" y="450" font-size="10.5" fill="#94A3B8">Resource Graph · 9 KQL query groups</text>

  <!-- ===================== AWS Connector ===================== -->
  <g filter="url(#shadow)">
    <rect x="660" y="382" width="300" height="80" rx="14" fill="#FFFFFF" stroke="#FBE1B8" stroke-width="1.5"/>
    <rect x="660" y="382" width="6" height="80" rx="3" fill="#FF9900"/>
  </g>
  <text x="690" y="414" font-size="15" font-weight="700" fill="#1A202C">AWS Connector</text>
  <text x="690" y="433" font-size="11" fill="#64748B">aws/connector.py</text>
  <text x="690" y="450" font-size="10.5" fill="#94A3B8">boto3 · 14+ resource types, every region</text>

  <!-- connectors down to external APIs -->
  <line x1="450" y1="462" x2="450" y2="494" stroke="#0078D4" stroke-width="1.75" marker-end="url(#arrowBlue)"/>
  <line x1="810" y1="462" x2="810" y2="494" stroke="#FF9900" stroke-width="1.75"/>

  <!-- ===================== External API pills ===================== -->
  <g filter="url(#shadow)">
    <rect x="320" y="498" width="260" height="40" rx="20" fill="#EAF3FC" stroke="#CFE3F7" stroke-width="1"/>
  </g>
  <text x="450" y="523" font-size="11.5" font-weight="600" fill="#0A5A9C" text-anchor="middle">Azure Monitor (VM CPU / memory)</text>

  <g filter="url(#shadow)">
    <rect x="680" y="498" width="260" height="40" rx="20" fill="#FFF3DE" stroke="#FBE1B8" stroke-width="1"/>
  </g>
  <text x="810" y="523" font-size="11.5" font-weight="600" fill="#B36B00" text-anchor="middle">AWS SDK — EC2 · RDS · CloudWatch</text>

  <line x1="450" y1="538" x2="450" y2="562" stroke="#0078D4" stroke-width="1.75"/>
  <line x1="810" y1="538" x2="810" y2="562" stroke="#FF9900" stroke-width="1.75"/>
  <path d="M450,562 L450,578 L620,578" fill="none" stroke="#0078D4" stroke-width="1.75"/>
  <path d="M810,562 L810,578 L620,578" fill="none" stroke="#FF9900" stroke-width="1.75"/>

  <g filter="url(#shadow)">
    <rect x="480" y="562" width="280" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <text x="620" y="587" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Retail Pricing APIs (enrich cost)</text>

  <!-- pricing down to DB -->
  <line x1="620" y1="602" x2="620" y2="634" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="632" y="622" font-size="10.5" fill="#94A3B8">persist</text>

  <!-- ===================== Azure SQL Database ===================== -->
  <g filter="url(#shadow)">
    <rect x="440" y="638" width="360" height="86" rx="14" fill="url(#dbGrad)"/>
  </g>
  <!-- cylinder icon -->
  <g transform="translate(468,660)">
    <ellipse cx="14" cy="6" rx="14" ry="6" fill="#FFFFFF" opacity="0.9"/>
    <path d="M0,6 L0,26 A14,6 0 0 0 28,26 L28,6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <ellipse cx="14" cy="6" rx="14" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
  </g>
  <text x="516" y="676" font-size="16" font-weight="700" fill="#FFFFFF">Azure SQL Database</text>
  <text x="516" y="696" font-size="11.5" fill="#D6F5E3">General Purpose · Serverless · auto-pause</text>
  <text x="516" y="713" font-size="10.5" fill="#B9E9CC">Passwordless — Managed Identity only</text>

  <!-- dashed read-back arrow to web app -->
  <path d="M440,681 C 180,681 180,174 298,174" fill="none" stroke="#94A3B8" stroke-width="1.75" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="70" y="430" font-size="11" fill="#64748B" transform="rotate(-90 70 430)" text-anchor="middle">dashboard reads — no live API calls</text>

  <!-- SQLAlchemy label near shared connection point -->
  <text x="248" y="628" font-size="10.5" fill="#94A3B8" text-anchor="middle">SQLAlchemy ORM</text>
  <text x="248" y="641" font-size="10.5" fill="#94A3B8" text-anchor="middle">(all pipeline modules)</text>
</svg>
