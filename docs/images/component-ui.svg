<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" width="1180" height="320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A202C" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1180" height="320" fill="#F7F8FA"/>

  <!-- UI Layer -->
  <g filter="url(#shadow)">
    <rect x="240" y="20" width="700" height="76" rx="14" fill="#1E2761"/>
  </g>
  <text x="590" y="52" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">UI Layer — app.py (Streamlit)</text>
  <text x="590" y="76" font-size="11" fill="#B9C2E0" text-anchor="middle">Home · Inventory · Rightsizing · Savings Plan Analysis · RI Coverage · Recommendations · Maturity Assessment</text>

  <!-- 5 direct callees -->
  <!-- col centers: 100, 320, 540, 760, 990 (approx), width 190 each -->
  <!-- sync_pipeline.py -->
  <g filter="url(#shadow)">
    <rect x="10" y="180" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="10" y="180" width="200" height="6" rx="3" fill="#1E2761"/>
  </g>
  <text x="110" y="216" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">sync_pipeline.py</text>
  <text x="110" y="236" font-size="10" fill="#64748B" text-anchor="middle">data/ — orchestrates sync</text>
  <text x="110" y="256" font-size="9" fill="#94A3B8" text-anchor="middle" font-style="italic">continues below (2b)</text>

  <!-- inventory_loader.py -->
  <g filter="url(#shadow)">
    <rect x="230" y="180" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="230" y="180" width="200" height="6" rx="3" fill="#1E2761"/>
  </g>
  <text x="330" y="216" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">inventory_loader.py</text>
  <text x="330" y="236" font-size="10" fill="#64748B" text-anchor="middle">data/ — read-only for UI</text>
  <text x="330" y="256" font-size="9" fill="#94A3B8" text-anchor="middle" font-style="italic">continues below (2c)</text>

  <!-- engine.py -->
  <g filter="url(#shadow)">
    <rect x="450" y="180" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="450" y="180" width="200" height="6" rx="3" fill="#1E2761"/>
  </g>
  <text x="550" y="216" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">engine.py</text>
  <text x="550" y="236" font-size="10" fill="#64748B" text-anchor="middle">analysis/ — waterfall,</text>
  <text x="550" y="250" font-size="10" fill="#64748B" text-anchor="middle">SP/RI, recommendations</text>

  <!-- rightsizing.py -->
  <g filter="url(#shadow)">
    <rect x="670" y="180" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="670" y="180" width="200" height="6" rx="3" fill="#1E2761"/>
  </g>
  <text x="770" y="216" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">rightsizing.py</text>
  <text x="770" y="236" font-size="10" fill="#64748B" text-anchor="middle">analysis/ — CPU/memory</text>
  <text x="770" y="250" font-size="10" fill="#64748B" text-anchor="middle">classification</text>

  <!-- ri/sp_eligibility.py -->
  <g filter="url(#shadow)">
    <rect x="890" y="180" width="280" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="890" y="180" width="280" height="6" rx="3" fill="#1E2761"/>
  </g>
  <text x="1030" y="216" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">ri_eligibility.py / sp_eligibility.py</text>
  <text x="1030" y="236" font-size="10" fill="#64748B" text-anchor="middle">analysis/ — per-provider</text>
  <text x="1030" y="250" font-size="10" fill="#64748B" text-anchor="middle">eligibility rules</text>

  <!-- arrows from UI Layer bottom (y=96) to each box top (y=180) -->
  <path d="M300,96 L300,140 L110,140 L110,178" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="185" y="134" font-size="10" fill="#64748B">triggers sync</text>

  <path d="M420,96 L420,150 L330,150 L330,178" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="335" y="144" font-size="10" fill="#64748B">reads inventory</text>

  <line x1="550" y1="96" x2="550" y2="178" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="558" y="130" font-size="10" fill="#64748B">renders analysis</text>

  <path d="M700,96 L700,160 L770,160 L770,178" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>

  <path d="M780,96 L780,170 L1030,170 L1030,178" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
</svg>
