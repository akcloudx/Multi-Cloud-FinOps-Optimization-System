<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 410" width="1180" height="410" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A202C" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1180" height="410" fill="#F7F8FA"/>

  <!-- sync_pipeline.py (continued from 2a) -->
  <g filter="url(#shadow)">
    <rect x="440" y="20" width="300" height="70" rx="14" fill="#1E2761"/>
  </g>
  <text x="590" y="52" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">sync_pipeline.py</text>
  <text x="590" y="72" font-size="10.5" fill="#B9C2E0" text-anchor="middle" font-style="italic">continued from 2a</text>

  <!-- Row of 5 direct children, columns centered at: 118, 354, 590, 826, 1062 (width 215, gap 21) -->
  <!-- Azure Connector -->
  <g filter="url(#shadow)">
    <rect x="10" y="200" width="215" height="90" rx="12" fill="#FFFFFF" stroke="#CFE3F7" stroke-width="1.5"/>
    <rect x="10" y="200" width="215" height="6" rx="3" fill="#0078D4"/>
  </g>
  <text x="118" y="234" font-size="12.5" font-weight="700" fill="#1A202C" text-anchor="middle">azure_conn/connector.py</text>
  <text x="118" y="253" font-size="10" fill="#64748B" text-anchor="middle">Resource Graph</text>
  <text x="118" y="267" font-size="10" fill="#64748B" text-anchor="middle">9 KQL query groups</text>

  <!-- AWS Connector -->
  <g filter="url(#shadow)">
    <rect x="246" y="200" width="215" height="90" rx="12" fill="#FFFFFF" stroke="#FBE1B8" stroke-width="1.5"/>
    <rect x="246" y="200" width="215" height="6" rx="3" fill="#FF9900"/>
  </g>
  <text x="354" y="234" font-size="12.5" font-weight="700" fill="#1A202C" text-anchor="middle">aws/connector.py</text>
  <text x="354" y="253" font-size="10" fill="#64748B" text-anchor="middle">boto3 · 14+ resource types</text>
  <text x="354" y="267" font-size="10" fill="#64748B" text-anchor="middle">every enabled region</text>

  <!-- azure_retail_api.py -->
  <g filter="url(#shadow)">
    <rect x="482" y="200" width="215" height="90" rx="12" fill="#FFFFFF" stroke="#BFE9CE" stroke-width="1.5"/>
    <rect x="482" y="200" width="215" height="6" rx="3" fill="#1F7A4D"/>
  </g>
  <text x="590" y="234" font-size="12.5" font-weight="700" fill="#1A202C" text-anchor="middle">azure_retail_api.py</text>
  <text x="590" y="253" font-size="10" fill="#64748B" text-anchor="middle">pricing/ — Retail Prices API</text>

  <!-- aws_price_list.py -->
  <g filter="url(#shadow)">
    <rect x="718" y="200" width="215" height="90" rx="12" fill="#FFFFFF" stroke="#BFE9CE" stroke-width="1.5"/>
    <rect x="718" y="200" width="215" height="6" rx="3" fill="#1F7A4D"/>
  </g>
  <text x="826" y="234" font-size="12.5" font-weight="700" fill="#1A202C" text-anchor="middle">aws_price_list.py</text>
  <text x="826" y="253" font-size="10" fill="#64748B" text-anchor="middle">pricing/ — Price List API</text>

  <!-- commitment_pricing.py -->
  <g filter="url(#shadow)">
    <rect x="954" y="200" width="216" height="90" rx="12" fill="#FFFFFF" stroke="#BFE9CE" stroke-width="1.5"/>
    <rect x="954" y="200" width="216" height="6" rx="3" fill="#1F7A4D"/>
  </g>
  <text x="1062" y="234" font-size="12.5" font-weight="700" fill="#1A202C" text-anchor="middle">commitment_pricing.py</text>
  <text x="1062" y="253" font-size="10" fill="#64748B" text-anchor="middle">pricing/ — RI / SP retail rates</text>

  <!-- arrows from sync_pipeline bottom (y=90) fanning to each of the 5 boxes (top y=200) -->
  <path d="M480,90 L480,140 L118,140 L118,198" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M520,90 L520,155 L354,155 L354,198" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="590" y1="90" x2="590" y2="198" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="598" y="130" font-size="10" fill="#64748B">enrich pricing</text>
  <path d="M660,90 L660,155 L826,155 L826,198" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M700,90 L700,140 L1062,140 L1062,198" fill="none" stroke="#64748B" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Context notes, deliberately NOT wired into the arrow flow above -
       both share one identical style (tinted fill, no accent bar, same
       solid border) so that shared style itself reads as "this is a note,
       not a pipeline step," rather than the two notes looking arbitrarily
       different from each other the way they did before this fix
       (Credentials/Auth was solid-bordered, cache_admin.py was dashed,
       with nothing on the diagram explaining what that difference meant). -->
  <g filter="url(#shadow)">
    <rect x="10" y="330" width="451" height="68" rx="12" fill="#FFF3DE" stroke="#FBE1B8" stroke-width="1"/>
  </g>
  <text x="235" y="350" font-size="12" font-weight="700" fill="#B36B00" text-anchor="middle">Credentials / Auth</text>
  <text x="235" y="366" font-size="10" fill="#B36B00" text-anchor="middle">Service Principal (Azure) · IAM Role (AWS) — used by both connectors above</text>
  <text x="235" y="384" font-size="9" font-style="italic" fill="#C18A3D" text-anchor="middle">note — not a call in the diagram above</text>

  <g filter="url(#shadow)">
    <rect x="482" y="330" width="688" height="68" rx="12" fill="#EAF7EE" stroke="#BFE9CE" stroke-width="1"/>
  </g>
  <text x="826" y="350" font-size="12" font-weight="700" fill="#1F7A4D" text-anchor="middle">cache_admin.py</text>
  <text x="826" y="366" font-size="10" fill="#1F7A4D" text-anchor="middle">pricing/ — manual cache refresh utility (ops-only, not on the regular sync path)</text>
  <text x="826" y="384" font-size="9" font-style="italic" fill="#4C9C6F" text-anchor="middle">note — not a call in the diagram above</text>
</svg>
